apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: spider-link
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: arizwana/spider-link-backend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"

            - name: DB_HOST
              value: "mysql-service"

            - name: DB_USER
              value: "root"

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD

            - name: DB_NAME
              value: "spiderlink"

            - name: DB_PORT
              value: "3306"

            - name: JWT_SECRET
              value: "spider_link_secret_2026"
