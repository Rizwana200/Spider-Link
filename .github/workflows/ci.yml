name: Spider-Link CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend
        run: node --check server.js


  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build frontend Docker image
        run: docker build -t arizwana/spider-link-frontend:v2 ./client

      - name: Push frontend Docker image
        run: docker push arizwana/spider-link-frontend:v2

      - name: Build backend Docker image
        run: docker build -t arizwana/spider-link-backend:v1 ./server

      - name: Push backend Docker image
        run: docker push arizwana/spider-link-backend:v1


  deploy:
    name: Deploy to Minikube
    runs-on: [self-hosted, linux, x64]

    needs:
      - docker

    # Deploy only when code is pushed directly to main.
    # Pull requests will not deploy to the self-hosted runner.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Kubernetes cluster
        run: kubectl get nodes

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Restart frontend
        run: kubectl rollout restart deployment/frontend -n spider-link

      - name: Restart backend
        run: kubectl rollout restart deployment/backend -n spider-link

      - name: Wait for frontend rollout
        run: kubectl rollout status deployment/frontend -n spider-link --timeout=120s

      - name: Wait for backend rollout
        run: kubectl rollout status deployment/backend -n spider-link --timeout=120s

      - name: Check Spider-Link pods
        run: kubectl get pods -n spider-link